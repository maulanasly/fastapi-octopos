[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --tb=short -n auto --dist loadscope"
markers = [
    "no_db: pure unit test that skips the per-test database reset",
]
# Pinned starlette (1.2.1) deprecates the httpx-backed TestClient; our tests
# still use fastapi.testclient.TestClient. Not actionable until we move to
# httpx2, so keep the noise out of test output.
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "alembic/*"]

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = [
    "__init__.py",
    "*/migrations/*",
    "*/venv/*",
    "*/.venv/*",
    "*/env/*",
    "*/ENV/*",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency-injection idiom: Depends(...)/Query(...) in defaults.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Security",
    "app.api.dependencies.require_permissions",
]

[tool.ruff.format]
quote-style = "double"
