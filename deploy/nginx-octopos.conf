# nginx reverse proxy for the OctoPOS API.
# __DOMAIN__ is substituted by bootstrap.sh (use "_" when serving by IP).
#
# SSE note: /orders/serving/stream must not be buffered, or tracking events
# stall. Gzip is intentionally off here — the app middleware already gzips.

server {
    listen 80;
    server_name __DOMAIN__;

    # Product image uploads.
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Server-sent events: no buffering, long read timeout.
    location /api/v1/orders/serving/stream {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
    }
}
