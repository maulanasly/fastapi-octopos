services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: octopos-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: octopos
      TZ: UTC
    ports:
      - "5433:5432"
    volumes:
      - octopos_pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d octopos"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: octopos-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: .
    image: octopos-backend
    container_name: octopos-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      # Values are interpolated from .env; secrets are REQUIRED (fail_closed
      # refuses the tutorial default SECRET_KEY / 'admin' password).
      ENVIRONMENT: "${ENVIRONMENT:-production}"
      SECRET_KEY: "${SECRET_KEY:?set SECRET_KEY in .env}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}"
      BACKEND_CORS_ORIGINS: '${BACKEND_CORS_ORIGINS:-["http://localhost:3001"]}'
      BACKEND_CORS_ORIGIN_REGEX: "${BACKEND_CORS_ORIGIN_REGEX:-}"
      SQLALCHEMY_DATABASE_URI: "${SQLALCHEMY_DATABASE_URI:-postgresql+psycopg://postgres:postgres@postgres:5432/octopos}"
      RESERVATION_AUTO_EXPIRE_ENABLED: "${RESERVATION_AUTO_EXPIRE_ENABLED:-true}"
      DEFAULT_TAX_RATE: "${DEFAULT_TAX_RATE:-0.0}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      LOG_JSON: "true"
      MEDIA_DIR: "/data/media"
      RATE_LIMIT_STORAGE_URI: "${RATE_LIMIT_STORAGE_URI:-}"
    volumes:
      - media:/data/media
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  # Adopt the pre-existing postgres volume so the migrated SQLite data and
  # any prior state remain visible; the orphaned containers that owned it
  # were removed so compose manages this stack.
  octopos_pgdata:
    name: fastapi-octopos-multi-tenant_octopos_pgdata
  media:
