name: CD

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_DOMAIN: ${{ secrets.DEPLOY_DOMAIN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Compile smoke check
        run: python -m compileall app alembic

      - name: Package release
        run: git archive --format=tar.gz -o /tmp/octopos-release.tar.gz HEAD

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          install -m 600 /dev/null ~/deploy_key
          echo "$SSH_KEY" > ~/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload release
        env:
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
        run: |
          TS=$(date +%Y%m%d%H%M%S)
          echo "RELEASE_TS=$TS" >> "$GITHUB_ENV"
          ssh -i ~/deploy_key "$SSH_USER@$SSH_HOST" "mkdir -p /opt/octopos/releases/$TS"
          rsync -az --delete -e "ssh -i ~/deploy_key" \
            /tmp/octopos-release.tar.gz "$SSH_USER@$SSH_HOST:/opt/octopos/releases/$TS/"

      - name: Deploy
        env:
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
        run: |
          ssh -i ~/deploy_key "$SSH_USER@$SSH_HOST" "
            set -e
            cd /opt/octopos/releases/${{ env.RELEASE_TS }}
            tar xzf octopos-release.tar.gz
            rm octopos-release.tar.gz
            sudo /opt/octopos/releases/${{ env.RELEASE_TS }}/deploy/deploy.sh ${{ env.RELEASE_TS }}
          "

      - name: Verify public endpoint
        if: env.DEPLOY_DOMAIN != ''
        env:
          DEPLOY_DOMAIN: ${{ secrets.DEPLOY_DOMAIN }}
        run: |
          for _ in $(seq 1 15); do
            if curl -fsS "https://$DEPLOY_DOMAIN/api/v1/health" | grep -q '"ok"'; then
              echo "public health check passed"; exit 0
            fi
            sleep 4
          done
          echo "public health check failed" >&2; exit 1
